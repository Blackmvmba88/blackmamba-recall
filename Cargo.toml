[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/observer",
  "crates/workflow-engine",
  "crates/storage",
  "crates/macos-accessibility",
  "crates/cli",
  "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.82"
authors = ["BlackMamba RECORDS"]
repository = "https://github.com/Blackmvmba88/blackmamba-recall"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.11", features = ["serde", "v4"] }
